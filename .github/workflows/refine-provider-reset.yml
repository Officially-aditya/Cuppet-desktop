name: Refine provider reset behavior

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/refine-provider-reset.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refine reset behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/react/SettingsModal.tsx')
          s = path.read_text()
          old = "const resetModel = selected.model || '';"
          new = "const resetModel = isLocalCli ? '' : selected.model || '';"
          if s.count(old) != 1:
              raise SystemExit(f'reset model guard expected once, found {s.count(old)}')
          s = s.replace(old, new, 1)
          s = s.replace("? `Save ${providerLabel} first, then add a custom model.`", "? `Select ${providerLabel} first, then add a custom model.`", 1)
          path.write_text(s)

          test_path = Path('test/provider-settings-autosave.test.mjs')
          t = test_path.read_text()
          anchor = "  assert.doesNotMatch(source, /const save = async \\(event: React\\.FormEvent\\)/);\n"
          addition = "  assert.match(source, /const resetModel = isLocalCli \\? '' : selected\\.model \\|\\| ''/);\n  assert.doesNotMatch(source, /Save \\${providerLabel} first/);\n"
          if anchor not in t:
              raise SystemExit('test anchor not found')
          t = t.replace(anchor, anchor + addition, 1)
          test_path.write_text(t)
          PY
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          node --test test/provider-settings-autosave.test.mjs test/provider-model-renderer-sync.test.mjs
          npm run renderer:verify
      - name: Commit and clean runner
        run: |
          rm -f .github/workflows/refine-provider-reset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refine provider reset behavior"
          git push origin HEAD:ui/cuppet-branding
