name: Temporary composer height fix

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-composer-height-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0

      - name: Fix composer height reset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/renderer/react/ChatPane.tsx')
          text = p.read_text()
          anchor = "  useEffect(() => setSelected(0), [value]);\n"
          replacement = "  useEffect(() => setSelected(0), [value]);\n\n  // Re-measure after React commits any programmatic composer value change, including send/queue clears.\n  useEffect(() => {\n    resize(textarea.current);\n  }, [value]);\n"
          if anchor not in text:
              raise SystemExit('value effect anchor missing')
          text = text.replace(anchor, replacement, 1)
          old = "  const clearComposer = () => {\n    setValue('');\n    setAttachments([]);\n    if (fileInput.current) fileInput.current.value = '';\n    resize(textarea.current);\n    textarea.current?.focus();\n  };"
          new = "  const clearComposer = () => {\n    setValue('');\n    setAttachments([]);\n    if (fileInput.current) fileInput.current.value = '';\n    // Collapse immediately; the value effect above re-measures after the empty value is committed.\n    if (textarea.current) textarea.current.style.height = '54px';\n    textarea.current?.focus();\n  };"
          if old not in text:
              raise SystemExit('clearComposer anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Verify renderer
        run: |
          npm install
          npm run renderer:verify
          grep -Fq "textarea.current.style.height = '54px'" src/renderer/react/ChatPane.tsx
          grep -Fq "resize(textarea.current);" src/renderer/react/ChatPane.tsx

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/react/ChatPane.tsx
          git commit -m "fix: collapse composer after sending"
          git push origin HEAD:ui/cuppet-branding