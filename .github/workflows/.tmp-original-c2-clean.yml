name: Temporary original C2 cleanup

on:
  push:
    branches:
      - original-c2-command-surface
    paths:
      - scripts/.tmp-original-c2-clean.py

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-c2-command-surface
      - run: python3 scripts/.tmp-original-c2-clean.py
      - name: Commit cleaned source
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/service.mjs src/cli/main.mjs
          git commit -m "fix(commands): remove duplicate one-shot patches"
          git push origin HEAD:original-c2-command-surface
