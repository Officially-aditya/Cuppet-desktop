          replace_once(
              acp,
              "export function acpCliDescriptor(value) {\n  const descriptor = localCliDescriptor(value);\n  return descriptor?.transport === 'acp' ? descriptor : null;\n}\n\nexport class AcpCliAgentProvider {\n",
