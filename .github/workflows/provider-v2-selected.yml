name: Provider V2 Selected

on:
  workflow_dispatch:
  push:
    branches:
      - feat/provider-architecture-v2
    paths:
      - .github/provider-v2-test-trigger

concurrency:
  group: provider-v2-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  provider-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Verify renderer compiles against runtime-owned queueing
        run: npm run renderer:verify
      - name: Validate provider control-plane boundary
        run: node --test --test-concurrency=1 test/provider-control-plane.test.mjs test/provider-version-policy.test.mjs test/provider-status-presentation.test.mjs test/local-provider-version-check.test.mjs
      - name: Validate credential boundary
        run: node --test --test-concurrency=1 test/provider-credential-boundary.test.mjs
      - name: Validate durable send, run-state, and runtime-event authority
        run: node --test --test-concurrency=1 test/command-receipts.test.mjs test/command-receipt-database.test.mjs test/queued-send.test.mjs test/runtime-queue-contract.test.mjs test/runtime-client-recovery.test.mjs test/run-state-projection.test.mjs test/run-phase-lifecycle.test.mjs test/session-command-serializer.test.mjs test/runtime-service-run-authority.test.mjs test/runtime-diagnostics-run-health.test.mjs test/runtime-event-durability.test.mjs test/runtime-event-projection.test.mjs test/pe3-transaction.test.mjs test/c2-remote-commands.test.mjs test/c2-remote-bridge.test.mjs
      - name: Validate local CLI ownership identity
        run: node --test --test-concurrency=1 test/cli-agent-linking.test.mjs
      - name: Validate ACP runtime supervision
        run: node --test --test-concurrency=1 test/acp-runtime-supervisor.test.mjs
      - name: Validate structured provider failures
        run: node --test --test-concurrency=1 test/provider-error.test.mjs
      - name: Validate LaunchServices acceptance contract
        run: node --test --test-concurrency=1 test/gui-launchservices-path.test.mjs
      - name: Run provider architecture and ACP regressions
        run: >-
          node --test --test-concurrency=1
          test/provider-architecture-v2.test.mjs
          test/provider-driver-registry.test.mjs
          test/provider-conversation-bridge.test.mjs
          test/provider-runtime-manager.test.mjs
          test/provider-runtime-manager-real-acp.test.mjs
          test/provider-runtime-manager-codex.test.mjs
          test/provider-acp-runtime-v2.test.mjs
          test/provider-acp-model-switch.test.mjs
          test/acp-text-stream.test.mjs
          test/claude-code-provider.test.mjs
          test/codex-provider.test.mjs
          test/opencode-provider.test.mjs
          test/opencode-auth-status.test.mjs
          test/local-cli-environment.test.mjs
          test/runtime-service-provider-lifecycle.test.mjs
          test/runtime-c1.test.mjs
          test/provider-activity-renderer.test.mjs
          test/message-activities.test.mjs
          test/provider-model-renderer-sync.test.mjs
          test/execution-capabilities.test.mjs
          test/acp-cuppet-tools.test.mjs
          test/acp-cuppet-tool-session-security.test.mjs
          test/execution-kernel.test.mjs
          test/execution-benchmark.test.mjs
          test/acp-cli-provider.test.mjs
          test/reasoning-segmentation.test.mjs
          test/provider-model-catalog.test.mjs
          test/antigravity-model-discovery.test.mjs
          test/antigravity-provider.test.mjs
      - name: Run Phase 1 tail regressions
        run: >-
          node --test --test-concurrency=1
          test/runtime-cognitive.test.mjs
          test/runtime-pe3.test.mjs
          test/pe3-transaction.test.mjs
          test/runtime-process.test.mjs
          test/runtime-project-binding.test.mjs
          test/runtime-queue-contract.test.mjs
          test/turn-store.test.mjs
          test/run-state-projection.test.mjs
          test/run-phase-lifecycle.test.mjs
          test/session-command-serializer.test.mjs
          test/runtime-service-run-authority.test.mjs
          test/runtime-service-provider-lifecycle.test.mjs
          test/runtime-service.test.mjs
          test/session-retention.test.mjs
          test/title-generator.test.mjs
          test/tool-runtime.test.mjs
          test/tst-data-alias.test.mjs
          test/usage-ledger.test.mjs
          test/workspace-enhancements.test.mjs
      - name: Smoke released OpenCode ACP transport
        run: |
          npm install -g opencode-ai@1.18.30
          opencode --version
          node scripts/smoke-live-opencode-acp.mjs
      - name: Verify benchmark, authenticated smoke, and release gate harnesses
        run: |
          node --check scripts/run-provider-benchmark.mjs
          node --check scripts/compare-provider-benchmarks.mjs
          node --check scripts/run-provider-benchmark-suite.mjs
          node --check scripts/smoke-authenticated-opencode-acp.mjs
          node --check scripts/smoke-authenticated-opencode-desktop-path.mjs
          node --check scripts/smoke-launchservices-cli-path.mjs
          node --check scripts/verify-provider-release-gate.mjs
          node -e "const fs=require('node:fs'); const schema=JSON.parse(fs.readFileSync('benchmarks/provider-v2.schema.json','utf8')); const example=JSON.parse(fs.readFileSync('benchmarks/provider-v2.example.json','utf8')); if(schema.properties.schemaVersion.const!==1 || example.schemaVersion!==1 || !Array.isArray(example.tasks) || !example.tasks.length) process.exit(1)"
          node -e "const fs=require('node:fs'); const smoke=fs.readFileSync('scripts/smoke-authenticated-opencode-acp.mjs','utf8'); const policy=fs.readFileSync('src/runtime/providers/version-policy.mjs','utf8'); if(!smoke.includes('totalCompletedTurns, 2') || !smoke.includes('warmRuntimeCount, 1') || !smoke.includes('previousMarker') || !smoke.includes('assertLocalProviderVersionSupported') || smoke.includes('MIN_OPENCODE_VERSION') || !policy.includes(\"minimumVersion: '1.18.30'\")) process.exit(1)"
          node -e "const fs=require('node:fs'); const smoke=fs.readFileSync('scripts/smoke-authenticated-opencode-desktop-path.mjs','utf8'); if(!smoke.includes('session.send') || !smoke.includes('providerError?.diagnostic') || !smoke.includes('CUPPET_RESOURCES_PATH')) process.exit(1)"
          node -e "const fs=require('node:fs'); const smoke=fs.readFileSync('scripts/smoke-launchservices-cli-path.mjs','utf8'); if(!smoke.includes('/usr/bin/open') || !smoke.includes('env: launchEnvironment') || !smoke.includes('/usr/bin:/bin:/usr/sbin:/sbin') || smoke.includes('Contents/MacOS/cuppet')) process.exit(1)"

          GITHUB_REF_NAME=feat/provider-architecture-v2 \
          GITHUB_EVENT_NAME=workflow_dispatch \
          GITHUB_SHA=gate-test-sha \
          CUPPET_AUTHENTICATED_OPENCODE_COMMIT=gate-test-sha \
          CUPPET_AUTHENTICATED_OPENCODE_PASSED=true \
          node scripts/verify-provider-release-gate.mjs

          if GITHUB_REF_NAME=feat/provider-architecture-v2 \
             GITHUB_EVENT_NAME=push \
             GITHUB_SHA=gate-test-sha \
             CUPPET_AUTHENTICATED_OPENCODE_COMMIT=gate-test-sha \
             CUPPET_AUTHENTICATED_OPENCODE_PASSED=true \
             node scripts/verify-provider-release-gate.mjs; then
            echo "Provider V2 push release gate unexpectedly passed" >&2
            exit 1
          fi

          if GITHUB_REF_NAME=feat/provider-architecture-v2 \
             GITHUB_EVENT_NAME=push \
             GITHUB_SHA=gate-test-sha \
             CUPPET_PROVIDER_V2_RELEASE_MODE=unauthenticated-rc \
             CUPPET_AUTHENTICATED_OPENCODE_COMMIT=gate-test-sha \
             CUPPET_AUTHENTICATED_OPENCODE_PASSED=true \
             node scripts/verify-provider-release-gate.mjs; then
            echo "Legacy unauthenticated Provider V2 RC bypass unexpectedly passed" >&2
            exit 1
          fi

          if GITHUB_REF_NAME=feat/provider-architecture-v2 \
             GITHUB_EVENT_NAME=workflow_dispatch \
             GITHUB_SHA=gate-test-sha \
             CUPPET_AUTHENTICATED_OPENCODE_COMMIT=wrong-sha \
             CUPPET_AUTHENTICATED_OPENCODE_PASSED=true \
             node scripts/verify-provider-release-gate.mjs; then
            echo "Provider V2 mismatched-SHA release gate unexpectedly passed" >&2
            exit 1
          fi

  macos-gui-cli-path:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install desktop dependencies with Electron app bundle
        run: npm install
      - name: Validate LaunchServices smoke contract
        run: node --test --test-concurrency=1 test/gui-launchservices-path.test.mjs
      - name: Prove Finder/Dock CLI PATH recovery through runtime authority
        run: node scripts/smoke-launchservices-cli-path.mjs
