name: Apply TST Sidebar UI

on:
  push:
    branches:
      - feat/tst-memory-sidebar-ui
    paths:
      - .github/workflows/apply-tst-sidebar-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/tst-memory-sidebar-ui
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply final UI polish
        run: python scripts/finalize-tst-sidebar-ui.py
      - name: Commit final UI polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: remove ambiguous completions and type memory graph'
          git push origin HEAD:feat/tst-memory-sidebar-ui

# final contract polish trigger
