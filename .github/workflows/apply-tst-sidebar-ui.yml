name: Apply TST Sidebar UI

on:
  push:
    branches:
      - feat/tst-memory-sidebar-ui
    paths:
      - .github/workflows/apply-tst-sidebar-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/tst-memory-sidebar-ui
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply UI and runtime integration
        run: python scripts/apply-tst-sidebar-ui-patch.py
      - name: Commit integrated UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'feat: add contextual TST memory sidebar and richer tool activity'
          git push origin HEAD:feat/tst-memory-sidebar-ui
