name: Temporary unbounded general chats

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-general-chats-unbounded.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - name: Keep General chats unbounded
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sidebar = Path('src/renderer/react/Sidebar.tsx')
          text = sidebar.read_text()

          old = "const MAX_VISIBLE_CHATS = 5;\nconst GENERAL_CHAT_GROUP = '__general__';\n"
          new = "const MAX_VISIBLE_CHATS = 5;\n"
          assert old in text, 'general group constant anchor missing'
          text = text.replace(old, new, 1)

          old = "    const projectSession = props.sessions.find((session) => session.id === props.activeSessionId);\n    const groupKey = projectSession?.projectId ?? (props.generalSessions.some((session) => session.id === props.activeSessionId) ? GENERAL_CHAT_GROUP : null);\n    if (!groupKey) return;\n    const groupSessions = groupKey === GENERAL_CHAT_GROUP ? props.generalSessions : (sessionsByProject.get(groupKey) ?? []);\n    if (groupSessions.findIndex((session) => session.id === props.activeSessionId) < MAX_VISIBLE_CHATS) return;\n"
          new = "    const projectSession = props.sessions.find((session) => session.id === props.activeSessionId);\n    const groupKey = projectSession?.projectId ?? null;\n    if (!groupKey) return;\n    const groupSessions = sessionsByProject.get(groupKey) ?? [];\n    if (groupSessions.findIndex((session) => session.id === props.activeSessionId) < MAX_VISIBLE_CHATS) return;\n"
          assert old in text, 'active chat expansion anchor missing'
          text = text.replace(old, new, 1)

          old = "              {(expandedChatGroups.has(GENERAL_CHAT_GROUP) ? props.generalSessions : props.generalSessions.slice(0, MAX_VISIBLE_CHATS)).map((session) => (\n                <SessionRow key={session.id} session={session} title={titleOverrides[session.id]} active={props.activeSessionId === session.id} onOpen={props.onSession} onMenu={openMenu} />\n              ))}\n              {props.generalSessions.length > MAX_VISIBLE_CHATS && (\n                <button\n                  type=\"button\"\n                  className=\"session-show-more\"\n                  aria-expanded={expandedChatGroups.has(GENERAL_CHAT_GROUP)}\n                  onClick={() => toggleChatGroup(GENERAL_CHAT_GROUP)}\n                >{expandedChatGroups.has(GENERAL_CHAT_GROUP) ? 'Show less' : 'Show more'}</button>\n              )}\n"
          new = "              {props.generalSessions.map((session) => (\n                <SessionRow key={session.id} session={session} title={titleOverrides[session.id]} active={props.activeSessionId === session.id} onOpen={props.onSession} onMenu={openMenu} />\n              ))}\n"
          assert old in text, 'general chat disclosure anchor missing'
          text = text.replace(old, new, 1)
          sidebar.write_text(text)

          verify = Path('scripts/verify-renderer.mjs')
          text = verify.read_text()
          anchor = "assert.match(sidebar, /session-show-more/, 'sidebar chat groups do not expose a show-more control');"
          replacement = anchor + "\nassert.doesNotMatch(sidebar, /GENERAL_CHAT_GROUP/, 'General chats should remain unbounded');\nassert.match(sidebar, /props\\.generalSessions\\.map\\(\\(session\\) =>/, 'General chats are not rendered freely');"
          assert anchor in text, 'sidebar disclosure verifier anchor missing'
          text = text.replace(anchor, replacement, 1)
          verify.write_text(text)
          PY
      - name: Verify renderer contract
        run: npm install && npm run renderer:verify
      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-general-chats-unbounded.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/react/Sidebar.tsx scripts/verify-renderer.mjs .github/workflows/tmp-general-chats-unbounded.yml
          git commit -m "fix: keep General chats unbounded"
          git push origin HEAD:ui/cuppet-branding
