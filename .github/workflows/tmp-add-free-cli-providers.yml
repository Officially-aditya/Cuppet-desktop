name: Temporary additional CLI providers

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-add-free-cli-providers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0

      - name: Apply Kiro ACP compatibility
        run: python3 scripts/tmp-kiro-acp-compat.py

      - name: Verify ACP compatibility
        run: |
          node --check src/runtime/acp-cli-provider.mjs
          node --test test/acp-cli-provider.test.mjs test/antigravity-provider.test.mjs
          grep -Fq "session/notification" src/runtime/acp-cli-provider.mjs
          grep -Fq "descriptor?.id === 'kiro'" src/runtime/acp-cli-provider.mjs

      - name: Commit compatibility fix
        shell: bash
        run: |
          rm scripts/tmp-kiro-acp-compat.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test scripts/tmp-kiro-acp-compat.py
          git commit -m "fix: support current Kiro ACP wire format"
          git push origin HEAD:ui/cuppet-branding
