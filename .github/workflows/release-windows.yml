name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact release tag to attach to (optional, defaults to v + package.json version)'
        required: false
        type: string
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-${{ github.ref_name }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BROWSERCONTROL_SOURCE_REVISION: 7079b761ccd3814e6eeeccf4f6dd4f97fd3598a8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version and tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            RELEASE_TAG='${{ inputs.tag }}'
          elif [[ "$GITHUB_REF_NAME" == release/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          elif [[ "$GITHUB_REF_NAME" == v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v$VERSION"
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version v$VERSION" >&2
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          repository: Officially-aditya/browserControl
          ref: 7079b761ccd3814e6eeeccf4f6dd4f97fd3598a8
          path: .release/browsercontrol
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Stage pinned official Codex app-server
        run: npm run e2:stage-codex

      - name: Build pinned browserControl runtime
        working-directory: .release/browsercontrol
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Stage verified browserControl resource for desktop
        run: npm run browsercontrol:stage -- --source=.release/browsercontrol

      - name: Install desktop dependencies
        run: npm install --ignore-scripts

      - name: Verify Windows OpenCode setup and ACP
        run: node --test test/windows-local-cli.test.mjs test/opencode-setup.test.mjs test/provider-version-policy.test.mjs test/local-provider-version-check.test.mjs test/opencode-auth-status.test.mjs test/opencode-provider.test.mjs

      - name: Build unsigned Windows release
        run: npm run release:win

      - name: Verify packaged interactive terminal
        run: node scripts/smoke-packaged-terminal.mjs

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -la
          EXE_PATH="$(find . -maxdepth 1 -type f -name "Cuppet-*-x64.exe" -print -quit)"
          ZIP_PATH="$(find . -maxdepth 1 -type f -name "Cuppet-*-x64.zip" -print -quit)"
          if [[ -z "$EXE_PATH" || -z "$ZIP_PATH" ]]; then
            echo "Expected Windows release artifacts were not produced." >&2
            exit 1
          fi
          (sha256sum "$EXE_PATH" "$ZIP_PATH" 2>/dev/null || shasum -a 256 "$EXE_PATH" "$ZIP_PATH") > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      - name: Upload Windows build artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: cuppet-windows-${{ env.VERSION }}
          path: |
            dist/Cuppet-*-x64.exe
            dist/Cuppet-*-x64.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Require exact-head stabilization gates
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..210}; do
            RUNS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            ready=true
            for workflow in "CI" "Provider V2 Selected"; do
              count="$(printf '%s' "$RUNS_JSON" | jq --arg workflow "$workflow" '[.workflow_runs[] | select(.name == $workflow and .status == "completed" and .conclusion == "success")] | length')"
              if [[ "$count" -lt 1 ]]; then
                ready=false
                failed="$(printf '%s' "$RUNS_JSON" | jq --arg workflow "$workflow" '[.workflow_runs[] | select(.name == $workflow and .status == "completed" and .conclusion != "success")] | length')"
                if [[ "$failed" -gt 0 ]]; then
                  echo "Exact release head $GITHUB_SHA failed $workflow." >&2
                  exit 1
                fi
              fi
            done
            if [[ "$ready" == "true" ]]; then break; fi
            if [[ "$GITHUB_REF_NAME" != release/v* || "$attempt" -eq 210 ]]; then
              echo "Exact release head $GITHUB_SHA is missing successful stabilization gates." >&2
              exit 1
            fi
            echo "Waiting for CI and Provider V2 Selected on $GITHUB_SHA..."
            sleep 10
          done

      - name: Publish or update GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          EXE_PATH="$(find dist -maxdepth 1 -type f -name "Cuppet-*-x64.exe" -print -quit)"
          ZIP_PATH="$(find dist -maxdepth 1 -type f -name "Cuppet-*-x64.zip" -print -quit)"
          assets=("$EXE_PATH" "$ZIP_PATH" "dist/SHA256SUMS-windows.txt")
          while IFS= read -r blockmap; do assets+=("$blockmap"); done < <(find dist -maxdepth 1 -type f -name '*.blockmap' -print)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Uploading Windows assets to existing release $RELEASE_TAG..."
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            echo "Creating release $RELEASE_TAG with Windows assets..."
            flags=()
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Cuppet $VERSION" --generate-notes "${flags[@]}"
          fi
