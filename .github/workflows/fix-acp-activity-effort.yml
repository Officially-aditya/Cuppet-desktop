name: Fix ACP activity and effort

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/fix-acp-activity-effort.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply ACP activity and advertised-effort patch
        run: |
          python .github/fix-acp-activity-effort.py
          python - <<'PY'
          from pathlib import Path
          path = Path('test/provider-model-renderer-sync.test.mjs')
          text = path.read_text()
          text = text.replace("const source = await readFile(join(root, 'src/renderer/react/ModelPicker.tsx'), 'utf8');", "const source = await readFile(new URL('../src/renderer/react/ModelPicker.tsx', import.meta.url), 'utf8');")
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install

      - name: Verify ACP activity and provider effort
        run: |
          node --test \
            test/acp-cli-provider.test.mjs \
            test/reasoning-segmentation.test.mjs \
            test/provider-model-catalog.test.mjs \
            test/provider-model-renderer-sync.test.mjs
          npm run renderer:verify

      - name: Commit implementation and remove temporary runner
        run: |
          rm -f .github/fix-acp-activity-effort.py .github/workflows/fix-acp-activity-effort.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: surface ACP activity and advertised effort"
          git push origin HEAD:ui/cuppet-branding
