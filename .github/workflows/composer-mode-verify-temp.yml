name: Composer Mode Verify Temp

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/composer-mode-verify-temp.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm run renderer:verify
