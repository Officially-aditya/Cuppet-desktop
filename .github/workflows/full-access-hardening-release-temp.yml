name: Full Access Hardening Release Temp

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/full-access-hardening-release-temp.yml

permissions:
  contents: write

concurrency:
  group: full-access-hardening-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden-test-release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TST_SOURCE_REVISION: 9f2a8ae63555b7534ee1ccfe211efce1ad46f630
      BROWSERCONTROL_SOURCE_REVISION: 7079b761ccd3814e6eeeccf4f6dd4f97fd3598a8
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Full access hardening patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              if old not in source:
                  raise SystemExit(f"Expected patch anchor missing in {path}: {old[:120]!r}")
              file.write_text(source.replace(old, new, 1))

          permissions = 'src/runtime/permissions.mjs'
          replace_once(
              permissions,
              "const AUTO_PROJECT_ACTIONS = new Set(['delete', 'agent-tool']);\n",
              "const AUTO_PROJECT_ACTIONS = new Set(['delete', 'agent-tool']);\nconst PLAN_MUTATING_ACTIONS = new Set(['edit', 'write', 'delete', 'bash', 'browser-control', 'agent-tool']);\n",
          )
          replace_once(
              permissions,
              "  if (planMode && ['edit', 'write', 'delete', 'bash'].includes(action)) return { effect: 'deny', code: 'plan_mode_read_only', reason: 'Plan mode is read-only; mutating tools and arbitrary shell commands are blocked.' };\n",
              "  if (planMode && PLAN_MUTATING_ACTIONS.has(action)) return { effect: 'deny', code: 'plan_mode_read_only', reason: 'Plan mode is read-only; mutating tools, browser control, agent side effects, and arbitrary shell commands are blocked.' };\n",
          )

          runtime = 'src/runtime/tool-runtime.mjs'
          replace_once(
              runtime,
              "      await authorize({ action: 'bash', resources: [command], description: `Run validation check in project: ${command.slice(0, 300)}` });\n      const executed = await runShell(command, projectRoot, clamp(Number(args.timeout_ms) || 60000, 1000, 120000), signal);\n",
              "      const permission = await authorize({ action: 'bash', resources: [command], description: `Run validation check in project: ${command.slice(0, 300)}` });\n      const executed = await runShell(command, projectRoot, clamp(Number(args.timeout_ms) || 60000, 1000, 120000), signal, { fullAccess: permission.source === 'session-full-access' });\n",
          )
          replace_once(
              runtime,
              "    await authorize({ action: 'bash', resources: [command], description: `Run shell command in project: ${command.slice(0, 300)}` });\n    const timeoutMs = clamp(Number(args.timeout_ms) || 30000, 1000, 120000);\n    const executed = await runShell(command, projectRoot, timeoutMs, signal);\n",
              "    const permission = await authorize({ action: 'bash', resources: [command], description: `Run shell command in project: ${command.slice(0, 300)}` });\n    const timeoutMs = clamp(Number(args.timeout_ms) || 30000, 1000, 120000);\n    const executed = await runShell(command, projectRoot, timeoutMs, signal, { fullAccess: permission.source === 'session-full-access' });\n",
          )
          replace_once(
              runtime,
              "function runShell(command, cwd, timeoutMs, signal) {\n  return new Promise((resolvePromise, reject) => {\n    const child = spawn(command, { cwd, shell: true, env: safeShellEnvironment(), stdio: ['ignore', 'pipe', 'pipe'] });\n",
              "export async function runShell(command, cwd, timeoutMs, signal, { fullAccess = false } = {}) {\n  const spawnSpec = await shellSpawnSpec(command, cwd, fullAccess);\n  return new Promise((resolvePromise, reject) => {\n    const child = spawn(spawnSpec.command, spawnSpec.args, { cwd, shell: spawnSpec.shell, env: safeShellEnvironment(), stdio: ['ignore', 'pipe', 'pipe'] });\n",
          )
          replace_once(
              runtime,
              "}\nfunction safeShellEnvironment() {\n",
              "}\nasync function shellSpawnSpec(command, cwd, fullAccess) {\n  if (!fullAccess || process.platform !== 'darwin') return { command, args: [], shell: true };\n  return {\n    command: '/usr/bin/sandbox-exec',\n    args: ['-p', await fullAccessMacSandboxProfile(cwd), '/bin/sh', '-lc', command],\n    shell: false,\n  };\n}\nexport async function fullAccessMacSandboxProfile(projectRoot) {\n  const root = await realpath(projectRoot).catch(() => resolve(projectRoot));\n  const literal = JSON.stringify(root);\n  return [\n    '(version 1)',\n    '(allow default)',\n    '(deny file-write-unlink)',\n    `(allow file-write-unlink (literal ${literal}))`,\n    `(allow file-write-unlink (subpath ${literal}))`,\n  ].join('\\n');\n}\nfunction safeShellEnvironment() {\n",
          )
          replace_once(
              runtime,
              "    mode === 'plan' ? 'Plan mode is read-only: tst_edit_batch may prepare/inspect but apply, generic writes, and arbitrary shell execution are blocked.' : '',\n",
              "    mode === 'plan' ? 'Plan mode is read-only: tst_edit_batch may prepare/inspect, but apply, generic writes, arbitrary shell execution, browser mutations, and agent side effects are blocked.' : '',\n",
          )

          test_file = 'test/full-access-permissions.test.mjs'
          replace_once(
              test_file,
              "import { agentPermissionAction, agentPermissionResources } from '../src/runtime/tool-runtime.mjs';\n",
              "import { agentPermissionAction, agentPermissionResources, runShell } from '../src/runtime/tool-runtime.mjs';\n",
          )
          replace_once(
              test_file,
              "    await assert.rejects(\n      broker.authorize({ sessionId: 's1', action: 'delete', resources: ['src/tmp'], projectRoot: root, planMode: true }),\n      (error) => error instanceof PermissionDeniedError && error.code === 'plan_mode_read_only',\n    );\n",
              "    await assert.rejects(\n      broker.authorize({ sessionId: 's1', action: 'delete', resources: ['src/tmp'], projectRoot: root, planMode: true }),\n      (error) => error instanceof PermissionDeniedError && error.code === 'plan_mode_read_only',\n    );\n    await assert.rejects(\n      broker.authorize({ sessionId: 's1', action: 'browser-control', resources: ['browser_click'], projectRoot: root, planMode: true }),\n      (error) => error instanceof PermissionDeniedError && error.code === 'plan_mode_read_only',\n    );\n    await assert.rejects(\n      broker.authorize({ sessionId: 's1', action: 'agent-tool', resources: ['opaque-side-effect'], projectRoot: root, planMode: true }),\n      (error) => error instanceof PermissionDeniedError && error.code === 'plan_mode_read_only',\n    );\n",
          )
          marker = "\n\ntest('ACP native terminal/delete permission requests feed the Full access delete boundary', () => {\n"
          integration = r'''

test('macOS Full access shell blocks indirect deletion outside the project at the syscall boundary', { skip: process.platform !== 'darwin' }, async () => {
  const { dir, root, outside } = await fixture();
  const outsideFile = join(outside, 'secret.txt');
  const insideFile = join(root, 'src', 'tmp', 'inside.txt');
  const commandFor = (source) => `${JSON.stringify(process.execPath)} -e ${JSON.stringify(source)}`;
  try {
    await writeFile(insideFile, 'inside\n');

    const outsideWrite = await runShell(
      commandFor(`require('node:fs').writeFileSync(${JSON.stringify(outsideFile)}, 'changed\\n')`),
      root,
      10_000,
      undefined,
      { fullAccess: true },
    );
    assert.equal(outsideWrite.code, 0, outsideWrite.stderr);

    const outsideDelete = await runShell(
      commandFor(`require('node:fs').rmSync(${JSON.stringify(outsideFile)})`),
      root,
      10_000,
      undefined,
      { fullAccess: true },
    );
    assert.notEqual(outsideDelete.code, 0, 'outside-project unlink unexpectedly succeeded');
    assert.equal(await readFile(outsideFile, 'utf8'), 'changed\n');

    const symlinkDelete = await runShell(
      commandFor(`require('node:fs').rmSync(${JSON.stringify(join(root, 'escape', 'secret.txt'))})`),
      root,
      10_000,
      undefined,
      { fullAccess: true },
    );
    assert.notEqual(symlinkDelete.code, 0, 'symlink escape unlink unexpectedly succeeded');
    assert.equal(await readFile(outsideFile, 'utf8'), 'changed\n');

    const insideDelete = await runShell(
      commandFor(`require('node:fs').rmSync(${JSON.stringify(insideFile)})`),
      root,
      10_000,
      undefined,
      { fullAccess: true },
    );
    assert.equal(insideDelete.code, 0, insideDelete.stderr);
    await assert.rejects(readFile(insideFile, 'utf8'));
  } finally { await rm(dir, { recursive: true, force: true }); }
});
'''
          file = Path(test_file)
          source = file.read_text()
          if marker not in source:
              raise SystemExit('ACP test marker missing')
          file.write_text(source.replace(marker, integration + marker, 1))

          print('Patched Full access permission boundary and tests.')
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install desktop dependencies
        run: npm install

      - name: Run Full access and complete unit test suite
        run: npm test

      - name: Verify renderer
        run: npm run renderer:verify

      - name: Commit hardened implementation and remove temp workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/full-access-hardening-release-temp.yml
          git add src/runtime/permissions.mjs src/runtime/tool-runtime.mjs test/full-access-permissions.test.mjs
          git commit -m "fix: enforce full access delete boundary"
          git push origin HEAD:ui/cuppet-branding
          PATCH_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${PATCH_SHA:0:12}"
          echo "PATCH_SHA=$PATCH_SHA" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          repository: Officially-aditya/Cuppet-code
          ref: 9f2a8ae63555b7534ee1ccfe211efce1ad46f630
          path: .release/cuppet-code
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: Officially-aditya/browserControl
          ref: 7079b761ccd3814e6eeeccf4f6dd4f97fd3598a8
          path: .release/browsercontrol
          persist-credentials: false

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          test -x /usr/bin/sandbox-exec
          sw_vers

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          rustup default 1.88
          rustc --version

      - name: Build pinned native TST daemon
        run: cargo build --locked -p tst-daemon --release --manifest-path .release/cuppet-code/Cargo.toml

      - name: Build standalone TST artifact
        working-directory: .release/cuppet-code
        run: |
          GITHUB_SHA="$TST_SOURCE_REVISION" node scripts/package-tst-runtime.mjs \
            --source=target/release/tst-daemon \
            --output="${GITHUB_WORKSPACE}/.release/tst-runtime"

      - name: Stage and verify native TST runtime
        run: |
          npm run f1:stage-tst -- --source=.release/tst-runtime
          npm run f1:verify-staged-tst

      - name: Stage and verify official Codex app-server package
        run: |
          npm run e2:stage-codex
          npm run e2:verify-staged-codex
          CODEX_DIR="vendor/codex/darwin-arm64/bin"
          test -x "$CODEX_DIR/codex-app-server"
          test -x "$CODEX_DIR/codex-code-mode-host"
          lipo -archs "$CODEX_DIR/codex-app-server" | grep -qw arm64
          lipo -archs "$CODEX_DIR/codex-code-mode-host" | grep -qw arm64

      - name: Build pinned browserControl runtime
        working-directory: .release/browsercontrol
        run: |
          npm ci
          npm run build

      - name: Stage and verify browserControl runtime
        run: |
          npm run browsercontrol:stage -- --source=.release/browsercontrol
          npm run browsercontrol:verify

      - name: Verify packaged runtime contracts
        run: |
          npm run e1:audit-runtime
          npm run f1:verify
          npm run e2:verify
          npm run browsercontrol:verify

      - name: Build Apple Silicon app bundle
        run: npm run build:renderer && npx electron-builder --mac dir --arm64 --publish never

      - name: Locate and verify arm64 app
        shell: bash
        run: |
          APP="$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          APP_EXEC="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          TST_BIN="$APP/Contents/Resources/tst/darwin-arm64/tst-daemon"
          CODEX_BIN="$APP/Contents/Resources/codex/darwin-arm64/bin/codex-app-server"
          CODEX_CODE_MODE_HOST="$APP/Contents/Resources/codex/darwin-arm64/bin/codex-code-mode-host"
          BROWSERCONTROL_ENTRY="$APP/Contents/Resources/browsercontrol/dist/local/runtime.js"
          test -x "$APP_EXEC"
          test -x "$TST_BIN"
          test -x "$CODEX_BIN"
          test -x "$CODEX_CODE_MODE_HOST"
          test -f "$BROWSERCONTROL_ENTRY"
          lipo -archs "$APP_EXEC" | grep -qw arm64
          lipo -archs "$TST_BIN" | grep -qw arm64
          lipo -archs "$CODEX_BIN" | grep -qw arm64
          lipo -archs "$CODEX_CODE_MODE_HOST" | grep -qw arm64
          test -f "$APP/Contents/Resources/app.asar"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_EXEC=$APP_EXEC" >> "$GITHUB_ENV"

      - name: Run packaged runtime acceptance
        run: |
          node scripts/smoke-packaged-runtime.mjs "$APP_EXEC"
          node scripts/smoke-packaged-tst.mjs "$APP_EXEC"
          node scripts/smoke-packaged-codex.mjs "$APP_EXEC"
          node scripts/smoke-packaged-browsercontrol.mjs "$APP_EXEC"

      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create release packages
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          ZIP="dist/Cuppet-${VERSION}-full-access-hardened-arm64.zip"
          DMG="dist/Cuppet-${VERSION}-full-access-hardened-arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          hdiutil create -volname "Cuppet" -srcfolder "$APP" -ov -format UDZO "$DMG"
          shasum -a 256 "$ZIP" "$DMG" > dist/SHA256SUMS.txt
          cat > dist/RELEASE-NOTES.txt <<EOF
          Cuppet ${VERSION} — Full access hardening candidate
          Commit: ${PATCH_SHA}

          This Apple Silicon build is ad-hoc signed, but is not Developer ID signed or notarized.

          Full access hardening in this build:
          - Plan mode remains read-only for browser-control and unknown ACP side-effect actions.
          - Direct destructive shell commands are still preflight-checked against the active project root.
          - On macOS, Full-access shell/validation execution is additionally wrapped in Seatbelt: unlink/delete syscalls are denied outside the active project root, including indirect deletion from child processes and symlink escapes, while ordinary reads/writes remain allowed.
          EOF

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: Cuppet-Full-Access-Hardened-${{ env.SHORT_SHA }}
          path: |
            dist/*-full-access-hardened-arm64.zip
            dist/*-full-access-hardened-arm64.dmg
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          TAG="full-access-hardened-${SHORT_SHA}"
          gh release create "$TAG" \
            dist/*-full-access-hardened-arm64.dmg \
            dist/*-full-access-hardened-arm64.zip \
            dist/SHA256SUMS.txt \
            dist/RELEASE-NOTES.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$PATCH_SHA" \
            --title "Cuppet ${VERSION} Full Access Hardened (${SHORT_SHA})" \
            --notes "Apple Silicon prerelease candidate with the Full access permission boundary hardened. Plan mode blocks browser/ACP mutations, and Full-access shell execution uses a macOS Seatbelt unlink boundary so child processes cannot delete outside the active project root. The app is ad-hoc signed and not notarized." \
            --prerelease
