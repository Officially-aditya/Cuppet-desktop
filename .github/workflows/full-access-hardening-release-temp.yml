name: Full Access Hardening Temp

on:
  push:
    branches: [ui/cuppet-branding]
    paths:
      - .github/workflows/full-access-hardening-release-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --version
