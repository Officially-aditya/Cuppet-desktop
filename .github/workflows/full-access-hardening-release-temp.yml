name: Full Access Hardening Temp

on:
  push:
    branches: [ui/cuppet-branding]
    paths:
      - .github/workflows/full-access-hardening-release-temp.yml

permissions:
  contents: write

concurrency:
  group: full-access-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply hardening
        run: python3 .github/apply-full-access-hardening-temp.py
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run Full access regression suite
        run: node --test test/full-access-permissions.test.mjs
      - name: Verify renderer
        run: npm run renderer:verify
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply-full-access-hardening-temp.py .github/workflows/full-access-hardening-release-temp.yml
          git add src/runtime/permissions.mjs src/runtime/tool-runtime.mjs test/full-access-permissions.test.mjs
          git commit -m "fix: enforce full access delete boundary"
          git push origin HEAD:ui/cuppet-branding
