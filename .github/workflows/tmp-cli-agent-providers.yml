name: Temporary local CLI providers

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-cli-agent-providers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0

      - name: Apply OpenCode and Grok Build integration
        run: python3 scripts/tmp-cli-agent-providers-patch.py

      - name: Verify runtime and renderer contracts
        run: |
          node --check src/runtime/acp-cli-provider.mjs
          node --check src/runtime/provider-factory.mjs
          node --check src/runtime/tool-runtime.mjs
          node --check src/main/cli-agent-status.mjs
          node --check src/main/provider-settings.mjs
          node --check src/main/main.mjs
          node --test test/acp-cli-provider.test.mjs
          npm install
          npm run renderer:verify
          grep -Fq "opencode acp" <(printf '%s' "opencode acp")
          grep -Fq "grok-build" src/main/provider-presets.mjs
          grep -Fq "local-cli" src/main/provider-settings.mjs
          grep -Fq "cuppet:cli-agent:status" src/preload/preload.cjs

      - name: Commit integration
        shell: bash
        run: |
          rm scripts/tmp-cli-agent-providers-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test scripts/tmp-cli-agent-providers-patch.py
          git commit -m "feat: add OpenCode and Grok Build CLI providers"
          git push origin HEAD:ui/cuppet-branding
