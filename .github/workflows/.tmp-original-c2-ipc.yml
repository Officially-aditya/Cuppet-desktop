name: Temporary original C2 palette IPC

on:
  push:
    branches:
      - original-c2-command-surface
    paths:
      - scripts/.tmp-original-c2-ipc.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-c2-command-surface
      - run: python3 scripts/.tmp-original-c2-ipc.py
      - name: Commit palette IPC boundary
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/main.mjs
          git commit -m "fix(commands): bound palette action IPC"
          git push origin HEAD:original-c2-command-surface
