name: Temporary original C2 final fix

on:
  push:
    paths:
      - 'scripts/.tmp-original-c2-fix.py'
      - '.github/workflows/.tmp-original-c2-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-c2-command-surface
      - run: python3 scripts/.tmp-original-c2-fix.py
      - name: Commit final Original C2 fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/commands.mjs src/runtime/remote/commands.mjs test/e-session-control.test.mjs test/original-c2-remote.test.mjs
          git commit -m "fix(commands): resolve provider authority lazily"
          git push origin HEAD:original-c2-command-surface
