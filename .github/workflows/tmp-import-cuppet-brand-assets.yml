name: Temporary Cuppet brand asset import

on:
  push:
    branches: [ui/cuppet-branding]
    paths:
      - .github/workflows/tmp-import-cuppet-brand-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - name: Import canonical Cuppet assets
        shell: bash
        env:
          ASSET_ARCHIVE: "https://sdmntpreastus.oaiusercontent.com/files/00000000-e718-81f9-b790-73c983cbe88d/raw?se=2026-09-10T16%3A15%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=18b7fe0c-1067-56d2-9b87-8f8d6f451547&skoid=0556a536-9b18-4aa8-bae0-70ed682ee936&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T02%3A05%3A22Z&ske=2026-09-11T02%3A05%3A22Z&sks=b&skv=2026-02-06&sig=YlvVKG3A4%2BVXOp5V9J2xPf%2B77FpjuRVal4ucB/LuXmo%3D"
        run: |
          set -euo pipefail
          curl -fsSL "$ASSET_ARCHIVE" -o /tmp/cuppet-brand-assets.zip
          rm -rf /tmp/cuppet-brand-assets
          mkdir -p /tmp/cuppet-brand-assets src/renderer/assets src/remote-app build
          unzip -q /tmp/cuppet-brand-assets.zip -d /tmp/cuppet-brand-assets
          install -m 0644 /tmp/cuppet-brand-assets/cuppet.png src/renderer/assets/cuppet.png
          install -m 0644 /tmp/cuppet-brand-assets/cuppet.png src/remote-app/cuppet.png
          install -m 0644 /tmp/cuppet-brand-assets/cuppet-app-icon.png build/icon.png
          install -m 0644 /tmp/cuppet-brand-assets/cuppet-app-icon.png src/remote-app/cuppet-app-icon.png
          python - <<'PY'
          from pathlib import Path
          import struct
          expected = {
              Path('src/renderer/assets/cuppet.png'): (1024, 1024),
              Path('build/icon.png'): (512, 512),
          }
          for path, size in expected.items():
              data = path.read_bytes()[:24]
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is not a PNG')
              actual = struct.unpack('>II', data[16:24])
              if actual != size:
                  raise SystemExit(f'{path}: expected {size}, got {actual}')
              print(f'{path}: {actual[0]}x{actual[1]}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/renderer/assets/cuppet.png src/remote-app/cuppet.png build/icon.png src/remote-app/cuppet-app-icon.png
          git rm .github/workflows/tmp-import-cuppet-brand-assets.yml
          git commit -m "assets: import canonical Cuppet branding"
          git push origin HEAD:ui/cuppet-branding
