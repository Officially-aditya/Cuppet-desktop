name: Temporary Cuppet brand asset import

on:
  push:
    branches: [ui/cuppet-branding]
    paths:
      - .github/workflows/tmp-import-cuppet-brand-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - name: Import canonical Cuppet assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/renderer/assets src/remote-app build
          curl -fsSL https://raw.githubusercontent.com/Officially-aditya/Cuppet/main/frontend/assets/logos/cuppet.png -o src/renderer/assets/cuppet.png
          cp src/renderer/assets/cuppet.png src/remote-app/cuppet.png
          curl -fsSL https://raw.githubusercontent.com/Officially-aditya/Cuppet/main/frontend/assets/logos/cuppet-app-icon.png -o build/icon.png
          cp build/icon.png src/remote-app/cuppet-app-icon.png
          python - <<'PY'
          from pathlib import Path
          import struct
          for path in [Path('src/renderer/assets/cuppet.png'), Path('build/icon.png')]:
              data = path.read_bytes()[:24]
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is not a PNG')
              width, height = struct.unpack('>II', data[16:24])
              print(f'{path}: {width}x{height}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/renderer/assets/cuppet.png src/remote-app/cuppet.png build/icon.png src/remote-app/cuppet-app-icon.png
          git rm .github/workflows/tmp-import-cuppet-brand-assets.yml
          git commit -m "assets: import canonical Cuppet branding"
          git push origin HEAD:ui/cuppet-branding
