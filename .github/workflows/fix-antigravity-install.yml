name: Fix Antigravity installer

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/fix-antigravity-install.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply Antigravity installer fix
        run: python .github/fix-antigravity-install.py
      - name: Verify local provider linking
        run: node --test test/cli-agent-linking.test.mjs test/antigravity-provider.test.mjs
      - name: Commit implementation and remove temporary runner
        run: |
          rm -f .github/fix-antigravity-install.py .github/workflows/fix-antigravity-install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use canonical Antigravity installer"
          git push origin HEAD:ui/cuppet-branding
