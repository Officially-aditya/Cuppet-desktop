name: Temporary native clipboard fix

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-fix-native-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - name: Wire native clipboard copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main/main.mjs')
          text = main.read_text()
          old = "import { app, BrowserWindow, dialog, ipcMain, shell } from 'electron';"
          new = "import { app, BrowserWindow, clipboard, dialog, ipcMain, shell } from 'electron';"
          assert old in text, 'main electron import anchor missing'
          text = text.replace(old, new, 1)
          old = "  ipcMain.handle('cuppet:native:open-external', (_event, url) => openExternal(url));"
          new = "  ipcMain.handle('cuppet:native:open-external', (_event, url) => openExternal(url));\n  ipcMain.handle('cuppet:native:copy-text', (_event, value) => {\n    const text = typeof value === 'string' ? value.slice(0, 2_000_000) : '';\n    clipboard.writeText(text);\n    return { copied: true };\n  });"
          assert old in text, 'native IPC anchor missing'
          text = text.replace(old, new, 1)
          main.write_text(text)

          preload = Path('src/preload/preload.cjs')
          text = preload.read_text()
          old = "    openExternal: (url) => ipcRenderer.invoke('cuppet:native:open-external', url),"
          new = "    openExternal: (url) => ipcRenderer.invoke('cuppet:native:open-external', url),\n    copyText: (text) => ipcRenderer.invoke('cuppet:native:copy-text', text),"
          assert old in text, 'preload native anchor missing'
          text = text.replace(old, new, 1)
          preload.write_text(text)

          types = Path('src/renderer/types.ts')
          text = types.read_text()
          old = "    chooseFolder: (options?: Record<string, unknown>) => Promise<string | null>;"
          new = "    chooseFolder: (options?: Record<string, unknown>) => Promise<string | null>;\n    copyText: (text: string) => Promise<{ copied: boolean }>;"
          assert old in text, 'renderer native type anchor missing'
          text = text.replace(old, new, 1)
          types.write_text(text)

          chat = Path('src/renderer/react/ChatPane.tsx')
          text = chat.read_text()
          old = "      await navigator.clipboard.writeText(value);"
          new = "      await window.cuppet.native.copyText(value);"
          assert old in text, 'copy handler anchor missing'
          text = text.replace(old, new, 1)
          chat.write_text(text)

          verify = Path('scripts/verify-renderer.mjs')
          text = verify.read_text()
          anchor = "assert.match(preload, /cuppet:usage:summary/, 'bounded preload does not expose token usage summary');"
          replacement = anchor + "\nassert.match(main, /cuppet:native:copy-text/, 'Electron main process does not expose native clipboard copy');\nassert.match(main, /clipboard\\.writeText\\(text\\)/, 'native clipboard IPC does not write through Electron clipboard');\nassert.match(preload, /copyText: \\(text\\) => ipcRenderer\\.invoke\\('cuppet:native:copy-text'/, 'bounded preload does not expose native clipboard copy');\nassert.match(chat, /window\\.cuppet\\.native\\.copyText\\(value\\)/, 'assistant copy button does not use the native clipboard bridge');\nassert.doesNotMatch(chat, /navigator\\.clipboard/, 'assistant copy path returned to fragile renderer clipboard access');"
          assert anchor in text, 'verifier preload anchor missing'
          text = text.replace(anchor, replacement, 1)
          verify.write_text(text)
          PY
      - name: Verify copy contract
        run: node scripts/verify-renderer.mjs
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-native-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/main.mjs src/preload/preload.cjs src/renderer/types.ts src/renderer/react/ChatPane.tsx scripts/verify-renderer.mjs .github/workflows/tmp-fix-native-copy.yml
          git commit -m "fix: use native clipboard for assistant copy"
          git push origin HEAD:ui/cuppet-branding
