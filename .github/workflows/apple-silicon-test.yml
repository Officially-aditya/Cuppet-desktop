name: Apple Silicon Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/e2-apple-silicon-test
    paths:
      - .github/release-trigger

permissions:
  contents: write

concurrency:
  group: apple-silicon-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-artifact:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      TST_SOURCE_REVISION: 9f2a8ae63555b7534ee1ccfe211efce1ad46f630
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: Officially-aditya/Cuppet-code
          ref: 9f2a8ae63555b7534ee1ccfe211efce1ad46f630
          path: .e2/cuppet-code
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          rustup default 1.88
          rustc --version

      - name: Build pinned native TST daemon
        run: cargo build --locked -p tst-daemon --release --manifest-path .e2/cuppet-code/Cargo.toml

      - name: Build standalone TST artifact
        working-directory: .e2/cuppet-code
        run: |
          GITHUB_SHA="$TST_SOURCE_REVISION" node scripts/package-tst-runtime.mjs \
            --source=target/release/tst-daemon \
            --output="${GITHUB_WORKSPACE}/.e2/tst-runtime"

      - name: Stage and verify native TST runtime
        run: |
          npm run f1:stage-tst -- --source=.e2/tst-runtime
          npm run f1:verify-staged-tst

      - name: Stage and verify official Codex app-server package
        run: |
          npm run e2:stage-codex
          npm run e2:verify-staged-codex
          CODEX_DIR="vendor/codex/darwin-arm64/bin"
          test -x "$CODEX_DIR/codex-app-server"
          test -x "$CODEX_DIR/codex-code-mode-host"
          lipo -archs "$CODEX_DIR/codex-app-server" | grep -qw arm64
          lipo -archs "$CODEX_DIR/codex-code-mode-host" | grep -qw arm64

      - name: Install desktop dependencies
        run: npm install

      - name: Verify runtime and renderer contracts
        run: |
          npm run e1:audit-runtime
          npm run renderer:verify
          npm run f1:verify
          npm run e2:verify

      - name: Build Apple Silicon app bundle
        run: npm run build:renderer && npx electron-builder --mac dir --arm64 --publish never

      - name: Locate and verify arm64 app
        shell: bash
        run: |
          find dist -maxdepth 4 -print
          APP="$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "No macOS .app bundle was produced" >&2
            exit 1
          fi
          APP_EXEC="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          TST_BIN="$APP/Contents/Resources/tst/darwin-arm64/tst-daemon"
          CODEX_BIN="$APP/Contents/Resources/codex/darwin-arm64/bin/codex-app-server"
          CODEX_CODE_MODE_HOST="$APP/Contents/Resources/codex/darwin-arm64/bin/codex-code-mode-host"
          if [[ -z "$APP_EXEC" ]]; then
            echo "No executable found inside $APP/Contents/MacOS" >&2
            exit 1
          fi
          test -x "$APP_EXEC"
          test -x "$TST_BIN"
          test -x "$CODEX_BIN"
          test -x "$CODEX_CODE_MODE_HOST"
          test -f "$APP/Contents/Resources/codex/darwin-arm64/codex-package.json"
          lipo -archs "$APP_EXEC" | grep -qw arm64
          lipo -archs "$TST_BIN" | grep -qw arm64
          lipo -archs "$CODEX_BIN" | grep -qw arm64
          lipo -archs "$CODEX_CODE_MODE_HOST" | grep -qw arm64
          test -f "$APP/Contents/Resources/app.asar"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_EXEC=$APP_EXEC" >> "$GITHUB_ENV"
          echo "CODEX_BIN=$CODEX_BIN" >> "$GITHUB_ENV"
          echo "CODEX_CODE_MODE_HOST=$CODEX_CODE_MODE_HOST" >> "$GITHUB_ENV"

      - name: Run packaged runtime acceptance
        run: |
          node scripts/smoke-packaged-runtime.mjs "$APP_EXEC"
          node scripts/smoke-packaged-tst.mjs "$APP_EXEC"
          node scripts/smoke-packaged-codex.mjs "$APP_EXEC"

      - name: Ad-hoc sign test app
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create ZIP and DMG test packages
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          ZIP="dist/Cuppet-${VERSION}-apple-silicon-test.zip"
          DMG="dist/Cuppet-${VERSION}-apple-silicon-test.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          hdiutil create -volname "Cuppet Test" -srcfolder "$APP" -ov -format UDZO "$DMG"
          shasum -a 256 "$ZIP" "$DMG" > dist/SHA256SUMS.txt
          cat > dist/TESTING.txt <<'EOF'
          Cuppet Apple Silicon test build

          This build is ARM64 and ad-hoc signed for testing, but it is NOT Developer ID signed or notarized yet.
          If macOS blocks the first launch, right-click the app and choose Open, or use System Settings > Privacy & Security > Open Anyway.

          Please test:
          - app launch and React renderer load
          - type /status, /doctor, /plan, /models and verify slash commands execute without starting a model generation
          - Settings > Platform > Codex: API-key field is replaced by the ChatGPT account flow
          - complete ChatGPT sign-in in the browser and confirm Settings reports Connected
          - send a general Codex-backed chat and restart the app
          - open a project and ask Codex to read a file through Cuppet tools; workspace tools should start without codex-code-mode-host errors
          - approve a small edit, run validation, then verify /undo restores it
          - confirm permission prompts/audit activity still appear for Codex tool calls
          - create/open two local projects and verify only the active project OR active chat is highlighted, never both
          - TST-backed graph/context behavior in both projects
          - memory persistence after restart
          - project isolation
          EOF

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: Cuppet-Apple-Silicon-Test-${{ github.sha }}
          path: |
            dist/*-apple-silicon-test.zip
            dist/*-apple-silicon-test.dmg
            dist/SHA256SUMS.txt
            dist/TESTING.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="apple-silicon-test-${GITHUB_SHA:0:12}"
          TITLE="Cuppet Apple Silicon Test ${GITHUB_SHA:0:12}"
          gh release create "$TAG" \
            dist/*-apple-silicon-test.dmg \
            dist/*-apple-silicon-test.zip \
            dist/SHA256SUMS.txt \
            dist/TESTING.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Unsigned/notarized Apple Silicon test candidate. The DMG is the recommended download. Built on native arm64 macOS and passed React renderer verification plus E1/F1/E2 packaged acceptance with the complete official OpenAI Codex app-server package, including codex-code-mode-host." \
            --prerelease
