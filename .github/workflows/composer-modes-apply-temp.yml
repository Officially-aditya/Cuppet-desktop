name: Apply Composer Modes Temp

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/composer-modes-apply-temp.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply composer mode patch
        run: python3 scripts/apply-composer-modes-temp.py
      - name: Install desktop dependencies
        run: npm install --ignore-scripts
      - name: Verify Full access policy remains green
        run: node --test test/c1-permissions.test.mjs test/full-access-permissions.test.mjs
      - name: Verify renderer contracts
        run: npm run renderer:verify
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify clean diff
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "Aditya Yadav"
          git config user.email "93206009+Officially-aditya@users.noreply.github.com"
          git add src/renderer/react/App.tsx src/renderer/react/ChatPane.tsx src/renderer/execution.css
          git diff --cached --quiet && { echo "Expected composer mode implementation diff was empty"; exit 1; }
          git commit -m "feat: add composer execution modes"
          git push origin HEAD:ui/cuppet-branding
