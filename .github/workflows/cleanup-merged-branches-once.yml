name: Cleanup merged branches once

on:
  push:
    branches:
      - feat/e2-apple-silicon-test
    paths:
      - .github/workflows/cleanup-merged-branches-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Delete only branches with merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            phase-0-baseline
            phase-1-independent-runtime
            phase-b-projects
            phase-b1-cognitive-runtime
            phase-b2-pe3-routing
            phase-c1-tools-permissions
            phase-c2-remote-control
            phase-d-provider-model-effort
            phase-e-session-control-parity
            original-c1-c-completion
            original-c2-command-surface
            feat/desktop-execution-ui
            feat/d1-search-navigation
            feat/d3-native-providers
            feat/e1-production-packaging
            fix/main-ci-e1
            feat/f1-managed-tst
          )
          for branch in "${branches[@]}"; do
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Already absent: $branch"
              continue
            fi
            merged_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --head "$branch" --json number --jq 'length')"
            if [[ "$merged_count" -lt 1 ]]; then
              echo "Refusing to delete unverified branch: $branch" >&2
              exit 1
            fi
            echo "Deleting merged branch: $branch"
            git push origin --delete "$branch"
          done
