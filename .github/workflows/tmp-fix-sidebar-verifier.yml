name: Temporary sidebar verifier fix

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-fix-sidebar-verifier.yml

permissions:
  contents: write

jobs:
  fix-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update stale sidebar font assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-renderer.mjs')
          text = path.read_text()
          old = text
          text = text.replace("font-size:13px/, 'primary sidebar navigation text is not 13px'", "font-size:14px/, 'primary sidebar navigation text is not 14px'")
          text = text.replace("font-size:13px/, 'project sidebar text is not 13px'", "font-size:14px/, 'project sidebar text is not 14px'")
          text = text.replace("font-size:13px/, 'chat/session sidebar text is not 13px'", "font-size:14px/, 'chat/session sidebar text is not 14px'")
          text = text.replace("font-size:13px/, 'sidebar footer action text is not 13px'", "font-size:14px/, 'sidebar footer action text is not 14px'")
          text = text.replace('the macOS sidebar has a persisted collapse control with 13px item text', 'the macOS sidebar has a persisted collapse control with 14px item text')
          if text == old:
              raise SystemExit('expected stale verifier text was not found')
          path.write_text(text)
          PY
          grep -q "primary sidebar navigation text is not 14px" scripts/verify-renderer.mjs
          grep -q "project sidebar text is not 14px" scripts/verify-renderer.mjs
          grep -q "chat/session sidebar text is not 14px" scripts/verify-renderer.mjs
          grep -q "sidebar footer action text is not 14px" scripts/verify-renderer.mjs
      - name: Commit verifier fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-sidebar-verifier.yml
          git add scripts/verify-renderer.mjs
          git commit -m "test: align sidebar verifier with 14px UI"
          git push origin HEAD:ui/cuppet-branding
