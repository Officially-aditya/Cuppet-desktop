name: Temporary original C2 finalize

on:
  push:
    branches:
      - original-c2-command-surface
    paths:
      - scripts/.tmp-original-c2-finalize.py

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-c2-command-surface
      - run: python3 scripts/.tmp-original-c2-finalize.py
      - name: Commit command authority fixes
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/commands.mjs src/main/main.mjs src/runtime/remote/commands.mjs src/renderer/app.js
          git commit -m "fix(commands): centralize command authorities"
          git push origin HEAD:original-c2-command-surface
