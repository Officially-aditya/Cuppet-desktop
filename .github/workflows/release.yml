name: Production Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag (must equal v + package.json version)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: production-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      BROWSERCONTROL_SOURCE_REVISION: 7079b761ccd3814e6eeeccf4f6dd4f97fd3598a8
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG='${{ inputs.tag }}'
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version v$VERSION" >&2
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Require exact-head stabilization gates
        shell: bash
        run: |
          set -euo pipefail
          RUNS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
          for workflow in "CI" "Provider V2 Selected"; do
            count="$(printf '%s' "$RUNS_JSON" | jq --arg workflow "$workflow" '[.workflow_runs[] | select(.name == $workflow and .status == "completed" and .conclusion == "success")] | length')"
            if [[ "$count" -lt 1 ]]; then
              echo "Exact release head $GITHUB_SHA has no successful completed $workflow run." >&2
              exit 1
            fi
          done

      - name: Require signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production release credential: $name" >&2
              exit 1
            fi
          done

      - name: Materialize App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / f"AuthKey_{os.environ['APPLE_API_KEY_ID']}.p8"
          target.write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64'], validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f"APPLE_API_KEY={target}\n")
          PY

      - uses: actions/checkout@v6
        with:
          repository: Officially-aditya/Cuppet-code
          ref: 9f2a8ae63555b7534ee1ccfe211efce1ad46f630
          path: .release/cuppet-code
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: Officially-aditya/browserControl
          ref: 7079b761ccd3814e6eeeccf4f6dd4f97fd3598a8
          path: .release/browsercontrol
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - name: Build pinned native TST daemon
        run: cargo build --locked -p tst-daemon --release --manifest-path .release/cuppet-code/Cargo.toml

      - name: Build standalone TST artifact from pinned Cuppet-code
        working-directory: .release/cuppet-code
        run: GITHUB_SHA=9f2a8ae63555b7534ee1ccfe211efce1ad46f630 node scripts/package-tst-runtime.mjs --source=target/release/tst-daemon --output=${{ github.workspace }}/.release/tst-runtime

      - name: Stage verified TST resource for desktop
        run: npm run f1:stage-tst -- --source=.release/tst-runtime

      - name: Stage pinned official Codex app-server
        run: npm run e2:stage-codex

      - name: Build pinned browserControl runtime
        working-directory: .release/browsercontrol
        run: |
          npm ci
          npm run build

      - name: Stage verified browserControl resource for desktop
        run: npm run browsercontrol:stage -- --source=.release/browsercontrol

      - name: Install desktop dependencies
        run: npm install

      - name: Verify release policy and runtime supply chain
        run: |
          npm run f1:verify-staged-tst
          npm run e2:verify-staged-codex
          npm run browsercontrol:verify
          npm run e1:audit-runtime
          npm run release:verify

      - name: Build, sign, and notarize macOS arm64 release
        run: npm run release:mac

      - name: Verify Developer ID signature, Gatekeeper, and notarization staple
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find dist -maxdepth 3 -type d -name 'Cuppet.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Packaged Cuppet.app not found" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Authority=Developer ID Application:' "$RUNNER_TEMP/codesign.txt"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Build hash-bound Squirrel update metadata
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find dist -maxdepth 1 -type f -name "Cuppet-${VERSION}-arm64.zip" -print -quit)"
          DMG_PATH="$(find dist -maxdepth 1 -type f -name "Cuppet-${VERSION}-arm64.dmg" -print -quit)"
          if [[ -z "$ZIP_PATH" || -z "$DMG_PATH" ]]; then
            echo "Expected arm64 DMG/ZIP release artifacts were not produced." >&2
            exit 1
          fi
          npm run release:feed -- --tag "$RELEASE_TAG" --zip "$ZIP_PATH" --output dist/releases.json
          shasum -a 256 "$DMG_PATH" "$ZIP_PATH" dist/releases.json > dist/SHA256SUMS.txt
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          assets=("$DMG_PATH" "$ZIP_PATH" dist/releases.json dist/SHA256SUMS.txt)
          if [[ -f dist/latest-mac.yml ]]; then assets+=(dist/latest-mac.yml); fi
          while IFS= read -r blockmap; do assets+=("$blockmap"); done < <(find dist -maxdepth 1 -type f -name '*.blockmap' -print)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            flags=()
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Cuppet $VERSION" --generate-notes "${flags[@]}"
          fi

      - name: Advance stable production update feed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "false" ]]; then
            FEED_PATH='macos/arm64/releases.json'
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/update-feed" >/dev/null 2>&1; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/heads/update-feed' -f sha="$GITHUB_SHA" >/dev/null
            fi
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$FEED_PATH?ref=update-feed" --jq '.sha' 2>/dev/null || true)"
            content="$(base64 < dist/releases.json | tr -d '\n')"
            if [[ -n "$existing_sha" ]]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FEED_PATH" -f message="release: advance macOS arm64 feed to $VERSION" -f content="$content" -f branch='update-feed' -f sha="$existing_sha" >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FEED_PATH" -f message="release: initialize macOS arm64 feed at $VERSION" -f content="$content" -f branch='update-feed' >/dev/null
            fi
          fi
