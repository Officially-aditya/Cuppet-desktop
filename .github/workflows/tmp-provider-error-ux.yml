name: Temporary provider error UX

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-provider-error-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - name: Apply provider error UX
        run: python3 scripts/tmp-provider-errors.py
      - name: Verify provider error UX
        run: |
          node --check src/runtime/provider-error.mjs
          node --check src/runtime/service.mjs
          node --test test/provider-error.test.mjs test/acp-cli-provider.test.mjs test/antigravity-provider.test.mjs
          npm install
          npm run renderer:verify
          grep -Fq "classifyProviderError" src/runtime/service.mjs
          grep -Fq "Rate limit reached" src/runtime/provider-error.mjs
          grep -Fq "Sign-in required" src/runtime/provider-error.mjs
      - name: Commit verified implementation
        shell: bash
        run: |
          rm scripts/tmp-provider-errors.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test scripts/verify-renderer.mjs scripts/tmp-provider-errors.py
          git commit -m "fix: show actionable provider errors"
          git push origin HEAD:ui/cuppet-branding
