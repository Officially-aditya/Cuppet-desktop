name: Temporary CLI path verification

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-cli-path-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
      - run: |
          node --check src/main/cli-agent-status.mjs
          node --check src/runtime/acp-cli-provider.mjs
          node --test test/acp-cli-provider.test.mjs
          grep -Fq '.opencode' src/main/cli-agent-status.mjs
          grep -Fq '.grok' src/main/cli-agent-status.mjs
