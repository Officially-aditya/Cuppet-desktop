name: Temporary browserControl integration

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-browsercontrol-integration.yml

permissions:
  contents: write

concurrency:
  group: browsercontrol-integration-ui-cuppet-branding
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0

      - name: Apply browserControl integration
        run: |
          python3 scripts/tmp-browsercontrol-integration-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-browsercontrol-mention-patch.py')
          text = path.read_text()
          text = text.replace('name="browserControl" mention="@browserControl"', 'name=\\"browserControl\\" mention=\\"@browserControl\\"')
          path.write_text(text)
          PY
          python3 scripts/tmp-browsercontrol-mention-patch.py

      - name: Verify integration contracts
        run: |
          node --check src/runtime/browser-control-manager.mjs
          node --check src/runtime/main.mjs
          node --check src/runtime/service.mjs
          node --check src/runtime/tool-runtime.mjs
          node --check src/runtime/permissions.mjs
          node --check src/runtime/codex-provider.mjs
          node --check src/main/main.mjs
          node --check src/main/runtime-client.mjs
          node --check scripts/stage-browsercontrol-runtime.mjs
          node --check scripts/verify-staged-browsercontrol.mjs
          node --check scripts/smoke-packaged-browsercontrol.mjs
          npm install
          npm run renderer:verify
          grep -Fq "@browserControl" src/runtime/service.mjs
          grep -Fq "integrations.includes('browserControl')" src/runtime/tool-runtime.mjs
          grep -Fq "browser-read" src/runtime/permissions.mjs
          grep -Fq "@browserControl" src/renderer/react/ChatPane.tsx

      - name: Commit integration and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/tmp-browsercontrol-integration.yml scripts/tmp-browsercontrol-integration-patch.py scripts/tmp-browsercontrol-mention-patch.py
          git checkout HEAD -- .github/workflows/apple-silicon-test.yml .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore package.json scripts src vendor/browsercontrol/.gitkeep .github/workflows/tmp-browsercontrol-integration.yml
          git commit -m "feat: activate browserControl with mentions"
          git push origin HEAD:ui/cuppet-branding
