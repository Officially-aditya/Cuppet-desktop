name: Remove provider footer copy

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/remove-provider-footer-copy.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Remove footer copy
        run: python .github/remove-provider-footer-copy.py

      - name: Verify source
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/renderer/react/SettingsModal.tsx').read_text()
          assert 'Changes apply immediately.' not in s
          assert "{busy ? 'Applying…' : 'Reset'}" in s
          PY

      - name: Verify renderer
        run: |
          npm install
          npm run renderer:verify

      - name: Commit and clean runner
        run: |
          rm -f .github/remove-provider-footer-copy.py .github/workflows/remove-provider-footer-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove provider settings footer copy"
          git push origin HEAD:ui/cuppet-branding
