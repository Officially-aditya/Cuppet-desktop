name: Verify TST Sidebar UI

on:
  push:
    branches:
      - feat/tst-memory-sidebar-ui
    paths:
      - src/**
      - .github/workflows/verify-tst-sidebar-ui.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Verify renderer TypeScript and build
        run: npm run renderer:verify
      - name: Check runtime syntax
        run: |
          node --check src/runtime/service.mjs
          node --check src/main/main.mjs
          node --check src/preload/preload.cjs
