name: Original C1 README finalization

on:
  push:
    branches:
      - original-c1-c-completion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-c1-c-completion
      - run: python3 scripts/.tmp-finalize-original-c1-readme.py
      - name: Commit README
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(c1): mark original C1 structural editing candidate"
          git push origin HEAD:original-c1-c-completion
