name: Original C1 graph fix

on:
  push:
    branches:
      - original-c1-c-completion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-c1-c-completion
      - run: python3 scripts/.tmp-fix-original-c1-graph-stale.py
      - name: Commit source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/tst-edit-batches.mjs
          git commit -m "fix(c1): keep structural work blocked until graph hashes recover"
          git push origin HEAD:original-c1-c-completion
