name: Temporary original C2 release patch

on:
  push:
    branches:
      - original-c2-command-surface
    paths:
      - scripts/.tmp-original-c2-release.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-c2-command-surface
      - run: python3 scripts/.tmp-original-c2-release.py
      - name: Commit Original C2 release metadata
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md src/runtime/main.mjs src/runtime/remote/commands.mjs src/cli/main.mjs
          git commit -m "chore(commands): register Original C2 release metadata"
          git push origin HEAD:original-c2-command-surface
