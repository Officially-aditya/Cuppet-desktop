name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  phase-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm run renderer:verify
      - run: npm run phase0:verify
      - run: npm run phase1:verify
      - run: npm run phaseb:verify
      - run: npm run phaseb1:verify
      - run: npm run phaseb2:verify
      - run: npm run phasec1:verify
      - run: npm run phasec2:verify
      - run: npm run phased:verify
      - run: npm run phasee:verify
      - run: npm run original-c1:verify
      - run: npm run original-c2:verify
      - run: npm run d1:verify
      - run: npm run d3:verify
      - run: npm run e1:verify
      - run: npm run f1:verify
      - run: npm run e2:verify

  packaged-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Officially-aditya/Cuppet-code
          ref: 9f2a8ae63555b7534ee1ccfe211efce1ad46f630
          path: .f1/cuppet-code
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - name: Build pinned native TST daemon
        run: cargo build --locked -p tst-daemon --release --manifest-path .f1/cuppet-code/Cargo.toml
      - name: Build standalone TST artifact from pinned Cuppet-code
        working-directory: .f1/cuppet-code
        run: GITHUB_SHA=9f2a8ae63555b7534ee1ccfe211efce1ad46f630 node scripts/package-tst-runtime.mjs --source=target/release/tst-daemon --output=${{ github.workspace }}/.f1/tst-runtime
      - name: Stage verified TST resource for desktop
        run: npm run f1:stage-tst -- --source=.f1/tst-runtime
      - run: npm run f1:verify-staged-tst
      - name: Stage pinned official Codex app-server
        run: npm run e2:stage-codex
      - run: npm run e2:verify-staged-codex
      - run: npm install
      - run: npm run e1:audit-runtime
      - run: npm run e2:verify
      - run: npm run pack:dir
      - run: npm run e1:package-smoke
      - run: npm run f1:package-smoke
      - run: npm run e2:package-smoke
