name: Original C1 fixup

on:
  push:
    branches:
      - original-c1-c-completion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-c1-c-completion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/.tmp-apply-original-c1-fixes.mjs
      - name: Commit fixup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/service.mjs src/runtime/tool-runtime.mjs src/runtime/journaled-tool-runtime.mjs src/runtime/tst-edit-batches.mjs
          git commit -m "fix(c1): enforce shared writer and verifier evidence semantics"
          git push origin HEAD:original-c1-c-completion
