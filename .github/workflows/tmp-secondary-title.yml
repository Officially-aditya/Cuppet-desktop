name: Temporary secondary model chat titles

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/tmp-secondary-title.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - name: Apply secondary title patch
        run: python3 scripts/tmp-secondary-title.py
      - name: Verify secondary title generation
        run: |
          node --check src/runtime/title-generator.mjs
          node --check src/runtime/service.mjs
          node --test test/title-generator.test.mjs
          npm install
          npm run renderer:verify
          grep -Fq "generateChatTitle" src/runtime/service.mjs
          grep -Fq "current.title !== provisionalTitle" src/runtime/service.mjs
      - name: Commit verified implementation
        shell: bash
        run: |
          rm scripts/tmp-secondary-title.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test scripts/verify-renderer.mjs scripts/tmp-secondary-title.py
          git commit -m "feat: title new chats with secondary model"
          git push origin HEAD:ui/cuppet-branding
