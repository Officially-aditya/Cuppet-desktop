name: Temporary Full Access Implementation

on:
  push:
    branches:
      - ui/cuppet-branding
    paths:
      - .github/workflows/implement-full-access-temp.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/cuppet-branding
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply Full access implementation
        run: python3 scripts/implement-full-access-temp.py
      - name: Install dependencies
        run: npm install
      - name: Verify Full access runtime and renderer
        run: |
          node --test test/c1-permissions.test.mjs test/full-access-permissions.test.mjs
          npm run renderer:verify
          npm run e2:verify
      - name: Commit verified implementation and remove temporary scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/permissions.mjs src/runtime/service.mjs src/runtime/tool-runtime.mjs src/main/main.mjs src/renderer/types.ts src/renderer/react/behavior-preferences.ts src/renderer/react/GeneralPanel.tsx src/renderer/react/ChatPane.tsx test/full-access-permissions.test.mjs
          git rm scripts/implement-full-access-temp.py .github/workflows/implement-full-access-temp.yml
          git diff --cached --check
          git commit -m "feat: add full access permission mode"
          git push origin HEAD:ui/cuppet-branding
