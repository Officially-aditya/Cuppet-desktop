name: Temporary Cuppet branding patch

on:
  push:
    branches: [ui/cuppet-branding]
    paths:
      - .github/workflows/tmp-apply-cuppet-branding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/cuppet-branding
          fetch-depth: 0
      - name: Apply brand surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def rep(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, expected))

          Path('src/renderer/react/brand.ts').write_text("export const CUPPET_LOGO_URL = new URL('../assets/cuppet.png', import.meta.url).href;\n")

          rep('src/renderer/react/Sidebar.tsx',
              "import type { Project, Session } from '../types';\n",
              "import type { Project, Session } from '../types';\nimport { CUPPET_LOGO_URL } from './brand';\n")
          rep('src/renderer/react/Sidebar.tsx',
              "{sidebarCollapsed && (\n        <>\n          <nav className=\"primary-nav sidebar-compact-nav\" aria-label=\"Primary\">",
              "{sidebarCollapsed && (\n        <>\n          <div className=\"sidebar-collapsed-brand\" title=\"Cuppet\"><img src={CUPPET_LOGO_URL} alt=\"\" aria-hidden=\"true\" /></div>\n          <nav className=\"primary-nav sidebar-compact-nav\" aria-label=\"Primary\">")
          rep('src/renderer/react/Sidebar.tsx',
              "<div className=\"brand-mark\" aria-hidden=\"true\">C</div>",
              "<img className=\"brand-mark\" src={CUPPET_LOGO_URL} alt=\"\" aria-hidden=\"true\" />")

          rep('src/renderer/react/ChatPane.tsx',
              "import { renderMarkdown } from './markdown';\n",
              "import { renderMarkdown } from './markdown';\nimport { CUPPET_LOGO_URL } from './brand';\n")
          rep('src/renderer/react/ChatPane.tsx',
              "<div className=\"empty-state\">\n          <h1>{emptyTitle}</h1>",
              "<div className=\"empty-state\">\n          <img className=\"empty-logo\" src={CUPPET_LOGO_URL} alt=\"\" aria-hidden=\"true\" />\n          <h1>{emptyTitle}</h1>")

          rep('src/renderer/react/App.tsx',
              "import { Toast } from './Toast';\n",
              "import { Toast } from './Toast';\nimport { CUPPET_LOGO_URL } from './brand';\n")
          rep('src/renderer/react/App.tsx',
              "if (loading) return <div className=\"react-boot\">Starting Cuppet…</div>;",
              "if (loading) return <div className=\"react-boot\"><div className=\"react-boot-brand\"><img src={CUPPET_LOGO_URL} alt=\"\" aria-hidden=\"true\" /><span>Starting Cuppet…</span></div></div>;")

          rep('src/renderer/react/SettingsModal.tsx',
              "import { GeneralPanel } from './GeneralPanel';\n",
              "import { GeneralPanel } from './GeneralPanel';\nimport { CUPPET_LOGO_URL } from './brand';\n")
          rep('src/renderer/react/SettingsModal.tsx',
              "<div className=\"settings-hub-brand\"><div className=\"settings-hub-mark\" aria-hidden=\"true\">C</div><div><strong>Settings</strong><span>Cuppet</span></div></div>",
              "<div className=\"settings-hub-brand\"><img className=\"settings-hub-mark\" src={CUPPET_LOGO_URL} alt=\"\" aria-hidden=\"true\" /><div><strong>Settings</strong><span>Cuppet</span></div></div>")
          rep('src/renderer/react/SettingsModal.tsx',
              "function AboutPanel() {\n  return <div className=\"settings-card\"><div className=\"settings-card-heading\"><div><h3>Cuppet Desktop</h3><p>Independent local agent runtime for projects, conversations, tools, and Remote.</p></div></div><div className=\"settings-row\"><div><strong>Renderer</strong><span>React + TypeScript, compiled with Vite.</span></div><span className=\"settings-value\">React</span></div><div className=\"settings-row\"><div><strong>Runtime</strong><span>Electron host with the independent Cuppet runtime.</span></div><span className=\"settings-value\">Desktop</span></div></div>;\n}",
              "function AboutPanel() {\n  return <div className=\"settings-card about-card\"><div className=\"about-brand\"><img src={CUPPET_LOGO_URL} alt=\"Cuppet\" /><div><h3>Cuppet Desktop</h3><p>Independent local agent runtime for projects, conversations, tools, and Remote.</p></div></div><div className=\"settings-row\"><div><strong>Renderer</strong><span>React + TypeScript, compiled with Vite.</span></div><span className=\"settings-value\">React</span></div><div className=\"settings-row\"><div><strong>Runtime</strong><span>Electron host with the independent Cuppet runtime.</span></div><span className=\"settings-value\">Desktop</span></div></div>;\n}")

          rep('src/renderer/styles.css',
              ".brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#eef1f5;color:#111318;font-weight:800}",
              ".brand-mark{width:30px;height:30px;display:block;object-fit:contain;border-radius:8px}")
          rep('src/renderer/styles.css',
              ".empty-state{max-width:560px;margin:18vh auto 0;text-align:center;color:#b6bdc8}",
              ".empty-state{max-width:560px;margin:18vh auto 0;text-align:center;color:#b6bdc8}.empty-logo{display:block;width:52px;height:52px;object-fit:contain;margin:0 auto 14px;border-radius:13px}")

          rep('src/renderer/react.css',
              ".react-boot{height:100vh;display:grid;place-items:center;background:#0d0f12;color:#8f98a6;font-size:13px}",
              ".react-boot{height:100vh;display:grid;place-items:center;background:#0d0f12;color:#8f98a6;font-size:13px}.react-boot-brand{display:grid;justify-items:center;gap:10px}.react-boot-brand img{display:block;width:44px;height:44px;object-fit:contain;border-radius:11px}")
          rep('src/renderer/react.css',
              ".react-sidebar.collapsed .sidebar-toggle-button{left:9px;right:auto}",
              ".react-sidebar.collapsed .sidebar-toggle-button{left:9px;right:auto}.sidebar-collapsed-brand{position:absolute;top:44px;left:9px;width:24px;height:24px;display:grid;place-items:center;pointer-events:none}.sidebar-collapsed-brand img{display:block;width:24px;height:24px;object-fit:contain;border-radius:6px}")
          rep('src/renderer/sidebar-icons.css', "  top:44px;", "  top:78px;")

          rep('src/renderer/settings.css',
              ".settings-hub-mark{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#eef1f5;color:#111318;font-weight:800}",
              ".settings-hub-mark{width:28px;height:28px;display:block;object-fit:contain;border-radius:8px}")
          rep('src/renderer/settings.css',
              ".settings-card+.settings-card{margin-top:14px}",
              ".settings-card+.settings-card{margin-top:14px}.about-brand{display:flex;align-items:center;gap:14px;margin-bottom:16px}.about-brand img{display:block;width:48px;height:48px;object-fit:contain;border-radius:12px}.about-brand>div{min-width:0}.about-brand h3{margin:0 0 4px;font-size:15px}.about-brand p{margin:0;color:#7f8997;font-size:11px;line-height:1.5}")

          rep('src/renderer/index.html',
              '<meta name="color-scheme" content="dark light" />\n    <title>Cuppet</title>',
              '<meta name="color-scheme" content="dark light" />\n    <link rel="icon" type="image/png" href="./assets/cuppet.png" />\n    <title>Cuppet</title>')

          rep('src/remote-app/index.html',
              '<link rel="manifest" href="/app/manifest.webmanifest"/><link rel="stylesheet" href="/app/styles.css"/>',
              '<link rel="manifest" href="/app/manifest.webmanifest"/><link rel="icon" type="image/png" href="/app/cuppet.png"/><link rel="apple-touch-icon" href="/app/cuppet-app-icon.png"/><link rel="stylesheet" href="/app/styles.css"/>')
          rep('src/remote-app/index.html',
              '<div class="card"><h1>Cuppet Remote</h1><p>Pair this device with your Cuppet host.</p>',
              '<div class="card"><div class="remote-brand"><img src="/app/cuppet.png" alt=""/><div><h1>Cuppet Remote</h1><p>Pair this device with your Cuppet host.</p></div></div>')
          rep('src/remote-app/index.html',
              '<header><div><span id="dot" class="dot off"></span><strong id="host">Cuppet host</strong></div>',
              '<header><div class="remote-host-brand"><img src="/app/cuppet.png" alt=""/><span id="dot" class="dot off"></span><strong id="host">Cuppet host</strong></div>')

          manifest = json.loads(Path('src/remote-app/manifest.webmanifest').read_text())
          manifest['icons'] = [{"src":"/app/cuppet-app-icon.png","sizes":"512x512","type":"image/png","purpose":"any"}]
          Path('src/remote-app/manifest.webmanifest').write_text(json.dumps(manifest, separators=(',', ':')) + '\n')
          rep('src/remote-app/styles.css',
              '.card h1{margin-top:0}',
              '.card h1{margin:0}.remote-brand{display:flex;align-items:center;gap:14px;margin-bottom:16px}.remote-brand>img{width:52px;height:52px;object-fit:contain;border-radius:13px;flex:0 0 auto}.remote-brand p{margin:5px 0 0}.remote-host-brand{display:flex;align-items:center;min-width:0}.remote-host-brand>img{width:24px;height:24px;object-fit:contain;border-radius:6px;margin-right:8px}.remote-host-brand .dot{margin-right:7px}')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          files = pkg['build']['files']
          for item in ['src/remote-app/**/*', 'build/icon.png']:
              if item not in files:
                  files.insert(-1, item)
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          rep('src/main/main.mjs',
              "const here = dirname(fileURLToPath(import.meta.url));\n",
              "const here = dirname(fileURLToPath(import.meta.url));\nconst APP_ICON = join(here, '..', '..', 'build', 'icon.png');\n")
          rep('src/main/main.mjs',
              "  registerIpc();\n  createWindow();",
              "  registerIpc();\n  if (process.platform === 'darwin' && app.dock) app.dock.setIcon(APP_ICON);\n  createWindow();")
          rep('src/main/main.mjs',
              "mainWindow = new BrowserWindow({ width: 1180, height: 800, minWidth: 860, minHeight: 620, show: false, backgroundColor: '#0d0f12', title: 'Cuppet', webPreferences:",
              "mainWindow = new BrowserWindow({ width: 1180, height: 800, minWidth: 860, minHeight: 620, show: false, backgroundColor: '#0d0f12', title: 'Cuppet', icon: APP_ICON, webPreferences:")

          rep('README.md',
              '# Cuppet Desktop\n\nIndependent desktop/runtime migration for Cuppet.',
              '# Cuppet Desktop\n\n<p align="center"><img src="src/renderer/assets/cuppet.png" alt="Cuppet" width="88" /></p>\n\nIndependent desktop/runtime migration for Cuppet.')
          PY
          git diff --check
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8')); JSON.parse(require('node:fs').readFileSync('src/remote-app/manifest.webmanifest','utf8'))"
          test -f src/renderer/assets/cuppet.png
          test -f src/remote-app/cuppet.png
          test -f src/remote-app/cuppet-app-icon.png
          test -f build/icon.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md package.json build/icon.png src/main/main.mjs src/renderer src/remote-app
          git rm .github/workflows/tmp-apply-cuppet-branding.yml
          git commit -m "feat: apply Cuppet branding across desktop"
          git push origin HEAD:ui/cuppet-branding
