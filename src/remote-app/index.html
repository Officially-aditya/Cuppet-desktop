<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0d0f12"/><link rel="manifest" href="/app/manifest.webmanifest"/><link rel="icon" type="image/png" href="/app/cuppet.png"/><link rel="apple-touch-icon" href="/app/cuppet-app-icon.png"/><link rel="stylesheet" href="/app/styles.css"/><title>Cuppet Remote</title></head><body>
<section id="pair" class="screen hidden"><div class="card"><div class="remote-brand"><img src="/app/cuppet.png" alt=""/><div><h1>Cuppet Remote</h1><p>Pair this device with your Cuppet host.</p></div></div><label>Pairing code<input id="pair-code" autocomplete="off" maxlength="24"/></label><label>Device name<input id="pair-name" maxlength="64"/></label><button id="pair-submit">Pair</button><p id="pair-error" class="error"></p></div></section>
<section id="app" class="screen hidden"><header><div class="remote-host-brand"><img src="/app/cuppet.png" alt=""/><span id="dot" class="dot off"></span><strong id="host">Cuppet host</strong></div><button id="refresh">Refresh</button></header><div class="controls"><select id="workspace"></select><select id="session"></select><button id="new-session">New</button><button id="plan">Build</button><button id="undo" title="Undo the latest Cuppet-owned reversible workspace mutation">Undo</button><select id="model" aria-label="Model"></select><select id="effort" aria-label="Effort"><option value="">Default effort</option></select><button id="stop" class="danger">Stop</button></div><main id="transcript"></main><section id="pending"></section><footer><textarea id="prompt" rows="2" placeholder="Message Cuppet…"></textarea><button id="send">Send</button></footer></section>
<script src="/app/app.js"></script></body></html>
